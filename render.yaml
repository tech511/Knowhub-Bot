services:
  - type: worker
    name: knowhub-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_NAME
        value: knowhub
      - key: OWNER_ID
        sync: false
